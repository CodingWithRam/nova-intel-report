<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle inner glow border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="8" />

  <!-- Central Nova Compass Symbol -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Outer Orbit Ring -->
    <circle r="140" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="8" stroke-dasharray="16 12" />
    
    <!-- Central 4-pointed Star -->
    <path d="M 0 -130 Q 18 -36 130 0 Q 18 36 0 130 Q -18 36 -130 0 Q -18 -36 0 -130 Z" fill="url(#starGrad)" />
    
    <!-- Diagonal sparkle accents -->
    <path d="M 0 -60 Q 8 -18 60 0 Q 8 18 0 60 Q -8 18 -60 0 Q -8 -18 0 -60 Z" fill="rgba(255,255,255,0.7)" transform="rotate(45)" />

    <!-- Core glowing nucleus -->
    <circle r="28" fill="#4f46e5" />
    <circle r="14" fill="#ffffff" />
  </g>
</svg>
